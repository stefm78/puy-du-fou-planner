name: QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check app-core.js
          node --check data.js
          node --check solver.js
          node --check sw.js
          node --check tests/solver.test.js
      - name: Data invariants
        run: |
          node <<'NODE'
          global.window = {};
          require('./data.js');
          const d = window.PUY_DATA;
          const assert = (x,m) => { if(!x) throw new Error(m); };
          assert(d.sourceEdit === '17/08/2026 19:48','wrong source edition');
          assert(d.appVersion === '1.4.2','wrong app version');
          assert(d.engineVersion === 4,'clock-only release must not invalidate solver plans');
          assert(d.activities.length === 15,'unexpected activity count');
          for (let i=1;i<=7;i++) assert(d.activities.find(a=>a.id===i)?.priority === true,`priority O missing for ${i}`);
          assert(!('homeDay' in d),'legacy hard homeDay pre-assignment must stay removed');
          assert(d.strategy.label === 'Contre-courant H→M→B','wrong strategy label');
          assert(JSON.stringify(d.strategy.descentOrder) === JSON.stringify(['H','M','B']),'wrong descent order');
          assert(d.strategy.nominalPriority['3'].day===18&&d.strategy.nominalPriority['3'].start==='10:15','Bal nominal target missing');
          assert(d.strategy.nominalPriority['1'].day===19&&d.strategy.nominalPriority['1'].start==='11:15','Signe day-19 counter-flow target missing');
          const arthur=d.strategy.nominalOptional['9'];
          assert(arthur.day===19&&arthur.start==='10:00'&&arthur.protected===true,'Arthur Wednesday opening target missing');
          assert(arthur.guardAnchor?.id===1&&arthur.guardAnchor?.start==='11:15','Arthur guard must protect Signe 11:15');
          assert(d.fixed[18].some(x=>x.id==='dinner'&&x.start==='20:00'),'Madelon 20:00 missing');
          assert(d.fixed[18].some(x=>x.id==='noces'&&x.start==='22:00'),'Noces 22:00 missing');
          assert(d.opening[18] === '09:00'&&d.opening[19] === '09:00','operational opening must start at 09:00 both days');
          assert(d.fallbackPlans[18][0].id===3&&d.fallbackPlans[18][0].openingMove===true,'day-18 nominal counter-flow missing');
          assert(d.fallbackPlans[19][0].id===9&&d.fallbackPlans[19][0].start==='10:00'&&d.fallbackPlans[19][0].openingMove===true,'day-19 Arthur counter-flow missing');
          assert(d.fallbackPlans[19][0].guardAnchor?.id===1,'fallback Arthur must protect Signe');
          const planned=new Set([...d.fallbackPlans[18],...d.fallbackPlans[19]].map(x=>Number(x.id)).filter(id=>d.activities.some(a=>a.id===id)));
          assert(planned.size===15,'fallback plans must expose all 15 activities');
          console.log('Data invariants OK');
          NODE
      - name: H-M-B + Arthur solver scenarios
        run: node tests/solver.test.js
      - name: Clock isolation invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app-core.js','utf8');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          assert(s.includes("clockMode:'system'"),'system clock must be the default');
          assert(s.includes('simulationPlan:{18:null,19:null}'),'simulation plan sandbox missing');
          assert(s.includes("function setDay(d){state.viewDay=Number(d);save();render()}"),'day tabs must be view-only');
          assert(s.includes("Simulation en lecture seule · le plan réel est protégé"),'simulation write guard missing');
          assert(s.includes("if(isSimulation()){\n    state.simulationPlan="),'simulation recalculation must write only to sandbox');
          assert(!s.includes('if(isLiveDay(state.day)||'),'legacy live-day boot recalculation must stay removed');
          assert(s.includes('Le simple passage du temps ou le changement d’onglet ne déclenche plus de recalcul silencieux.'),'clock safety diagnostic missing');
          console.log('Clock isolation OK');
          NODE
      - name: Mobile fail-fast boot
        run: |
          grep -q "VERSION='1.4.2'" app.js
          grep -q "SCRIPT_TIMEOUT_MS=4500" app.js
          grep -q "seedInstantPlan" app.js
          grep -q "renderInstantFallback" app.js
          grep -q "PUY_BOOT_DIAG_V1" app.js
          grep -q "Recharger avec force" app.js
          grep -Fq "bootState?.solverMeta?.fallback" app.js
          grep -q "horloge système ou simulation isolée" app.js
          grep -q "puy-planner-v1.4.2" sw.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app-core.js','utf8');
          const clone=s.indexOf('const clone=');
          const state=s.indexOf('let state=loadState()');
          if(clone<0||state<0||clone>state) throw new Error('clone must be initialized before loadState runs');
          console.log('Core boot ordering OK');
          NODE
      - name: PWA integrity
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f styles.css
          test -f app.js
          test -f app-core.js
          test -f data.js
          test -f solver.js
          grep -q 'manifest.webmanifest' index.html
          grep -q './solver.js' index.html
          grep -q 'serviceWorker' app-core.js
          grep -q 'ChatGPT est nécessaire' app-core.js
          grep -q 'PUY_STATE_V3' app-core.js
      - name: No accidental remote runtime dependency
        run: |
          ! grep -Eqi '<script[^>]+src="https?://|<link[^>]+href="https?://' index.html
