name: QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check app-core.js
          node --check data.js
          node --check solver.js
          node --check sw.js
          node --check tests/solver.test.js
      - name: Data invariants
        run: |
          node <<'NODE'
          global.window = {};
          require('./data.js');
          const d = window.PUY_DATA;
          const assert = (x,m) => { if(!x) throw new Error(m); };
          assert(d.sourceEdit === '17/08/2026 19:48','wrong source edition');
          assert(d.appVersion === '1.3.1','wrong app version');
          assert(d.engineVersion === 2,'wrong engine version');
          assert(d.activities.length === 15,'unexpected activity count');
          for (let i=1;i<=7;i++) assert(d.activities.find(a=>a.id===i)?.priority === true,`priority O missing for ${i}`);
          assert(!('homeDay' in d),'legacy pre-assignment homeDay must stay removed');
          assert(d.fixed[18].some(x=>x.id==='dinner'&&x.start==='20:00'),'Madelon 20:00 missing');
          assert(d.fixed[18].some(x=>x.id==='noces'&&x.start==='22:00'),'Noces 22:00 missing');
          assert(d.opening[18] === '09:00','operational opening must start planning at 09:00');
          assert(d.fallbackPlans[18][0].id===3&&d.fallbackPlans[18][0].openingMove===true,'instant fallback must expose counter-flow opening');
          console.log('Data invariants OK');
          NODE
      - name: Global solver scenarios
        run: node tests/solver.test.js
      - name: iPhone boot compatibility
        run: |
          grep -q "if(!window.PuySolver)" app.js
          grep -q "app-core.js" app.js
          grep -q "Mode secours" app.js
          grep -q "app-core.js" sw.js
          grep -q "puy-planner-v1.3.1" sw.js
      - name: PWA integrity
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f styles.css
          test -f app.js
          test -f app-core.js
          test -f data.js
          test -f solver.js
          grep -q 'manifest.webmanifest' index.html
          grep -q './solver.js' index.html
          grep -q 'serviceWorker' app-core.js
          grep -q 'ChatGPT est nécessaire' app-core.js
          grep -q 'PUY_STATE_V2' app-core.js
      - name: No accidental remote runtime dependency
        run: |
          ! grep -Eqi '<script[^>]+src="https?://|<link[^>]+href="https?://' index.html
