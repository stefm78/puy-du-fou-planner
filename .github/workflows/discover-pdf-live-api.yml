name: Discover Puy du Fou live API

on:
  push:
    paths:
      - '.github/workflows/discover-pdf-live-api.yml'

permissions:
  contents: write

jobs:
  inspect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Puy du Fou APK
        shell: bash
        run: |
          set +e
          OUT=api-discovery.txt
          : > "$OUT"
          URLS=(
            'https://baba-store.vercel.app/api/download/app-75704420-puy-du-fou-france'
            'https://d.apkpure.com/b/APK/fr.puydufou.android?version=latest'
          )
          ok=0
          for url in "${URLS[@]}"; do
            echo "Trying $url" | tee -a "$OUT"
            curl -A 'Mozilla/5.0' -fL --retry 2 --connect-timeout 15 --max-time 120 "$url" -o /tmp/puy.apk
            if unzip -t /tmp/puy.apk >/dev/null 2>&1; then
              echo "Downloaded $(stat -c%s /tmp/puy.apk) bytes" | tee -a "$OUT"
              ok=1
              break
            fi
          done
          if [ "$ok" -eq 1 ]; then
            rm -rf /tmp/puy && mkdir /tmp/puy
            unzip -q /tmp/puy.apk -d /tmp/puy
            {
              echo '=== URL CANDIDATES ==='
              find /tmp/puy -type f -size -80M -print0 | xargs -0 strings 2>/dev/null \
                | grep -Eo 'https?://[^[:space:]"<>]+' \
                | sed 's/[),;].*$//' | sort -u \
                | grep -Ei 'puy|api|mobile|cdn|program|show|spect|afflu|crowd|occup|tribun' | head -300
              echo '=== KEYWORD CONTEXT ==='
              find /tmp/puy -type f -size -80M -print0 | xargs -0 strings 2>/dev/null \
                | grep -Ei -C 4 'affluence|remplissage|tribune|occupancy|crowd|filling|fill.?rate|attendance' | head -700
              echo '=== API HINTS ==='
              find /tmp/puy -type f -size -80M -print0 | xargs -0 strings 2>/dev/null \
                | grep -Ei -C 3 'base.?url|retrofit|graphql|/api/|programme|programmes|sessions|seances|shows' | head -700
            } >> "$OUT" 2>&1
          else
            echo 'APK_DOWNLOAD_FAILED' >> "$OUT"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'chore: record Puy du Fou API discovery' || true
          git push || true
