name: Apply official 19 August program

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-official-19.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Promote 19 August from provisional to official
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          # Official PDF supplied by the visitor:
          # Wednesday 19 August 2026, edited 18/08/2026 at 15:52.
          # SHA-256: f5c5d8d5d7941440e42ad4ffa1aa67a0209a0bb795477febe214f887cb7bdb54
          # Its 15 activity schedules/durations are identical to the provisional schedule already encoded.
          patch('data.js', '  sourceEdit: "17/08/2026 19:48",\n  appVersion: "1.4.3",',
                '  sourceEdit: "17/08/2026 19:48",\n  sourceEdits: {18:"17/08/2026 19:48",19:"18/08/2026 15:52"},\n  sourceHashes: {19:"f5c5d8d5d7941440e42ad4ffa1aa67a0209a0bb795477febe214f887cb7bdb54"},\n  appVersion: "1.4.4",')

          # No schedule changed, so engineVersion deliberately remains 4 and existing plans/history are preserved.
          patch('app-core.js', "  if(d===19)h+=`<div class=\"notice\" style=\"margin-bottom:10px\"><strong>19 août provisoire :</strong> horaires encore copiés du 18. Le moteur réoptimisera seulement lors d'une action explicite ou en simulation.</div>`;\n", '')
          patch('app-core.js',
                "  document.getElementById('sourceLine').textContent=`${d===18?'18 officiel · édition '+D.sourceEdit:'19 provisoire'} · v${D.appVersion} · ${mode}`;",
                "  const edit=D.sourceEdits?.[d]||D.sourceEdit;document.getElementById('sourceLine').textContent=`${d} officiel · édition ${edit} · v${D.appVersion} · ${mode}`;")
          patch('app-core.js',
                '    <div class="settingsrow"><span>Source programme</span><span class="small">18 officiel · ${D.sourceEdit}</span></div>',
                '    <div class="settingsrow"><span>Source programme</span><span class="small">18 officiel · ${D.sourceEdits?.[18]||D.sourceEdit}<br>19 officiel · ${D.sourceEdits?.[19]||\'—\'}</span></div>')

          patch('index.html', 'MER 19 <span class="provisional">PROV.</span>', 'MER 19')
          patch('app.js', "const VERSION='1.4.3';", "const VERSION='1.4.4';")
          patch('app.js', "Planner opérationnel · historique + activité courante + futur.", "Planner opérationnel · programmes officiels 18 + 19 · historique protégé.")
          patch('sw.js', "const CACHE_NAME='puy-planner-v1.4.3';", "const CACHE_NAME='puy-planner-v1.4.4';")

          q=Path('.github/workflows/qa.yml'); s=q.read_text(encoding='utf-8')
          s=s.replace("assert(d.appVersion === '1.4.3','wrong app version');", "assert(d.appVersion === '1.4.4','wrong app version');")
          s=s.replace("assert(d.engineVersion === 4,'history-only release must not invalidate solver plans');", "assert(d.engineVersion === 4,'official-source release must not invalidate unchanged solver plans');")
          anchor="          assert(d.sourceEdit === '17/08/2026 19:48','wrong source edition');\n"
          extra=("          assert(d.sourceEdits?.[18] === '17/08/2026 19:48','wrong 18 source edition');\n"
                 "          assert(d.sourceEdits?.[19] === '18/08/2026 15:52','wrong 19 source edition');\n"
                 "          assert(d.sourceHashes?.[19] === 'f5c5d8d5d7941440e42ad4ffa1aa67a0209a0bb795477febe214f887cb7bdb54','wrong 19 PDF hash');\n")
          if extra not in s:
              if anchor not in s: raise SystemExit('QA source anchor missing')
              s=s.replace(anchor,anchor+extra)
          s=s.replace("grep -q \"VERSION='1.4.3'\" app.js", "grep -q \"VERSION='1.4.4'\" app.js")
          s=s.replace("grep -q \"historique + activité courante + futur\" app.js", "grep -q \"programmes officiels 18 + 19\" app.js")
          s=s.replace("grep -q \"puy-planner-v1.4.3\" sw.js", "grep -q \"puy-planner-v1.4.4\" sw.js")
          pwa="          grep -q 'PUY_STATE_V3' app-core.js\n"
          checks=("          ! grep -q '19 août provisoire' app-core.js\n"
                  "          ! grep -q 'PROV.' index.html\n"
                  "          grep -q 'sourceEdits' data.js\n")
          if checks not in s:
              if pwa not in s: raise SystemExit('QA PWA anchor missing')
              s=s.replace(pwa,pwa+checks)
          q.write_text(s,encoding='utf-8')

          # Remove the temporary source-probing experiment now that the official PDF has been supplied.
          Path('.github/workflows/fetch-official-program.yml').unlink(missing_ok=True)
          import shutil
          shutil.rmtree('official',ignore_errors=True)
          PY

      - name: Syntax and solver regression
        run: |
          node --check data.js
          node --check app.js
          node --check app-core.js
          node --check solver.js
          node --check sw.js
          node tests/solver.test.js
          grep -q 'appVersion: "1.4.4"' data.js
          grep -q 'sourceEdits: {18:"17/08/2026 19:48",19:"18/08/2026 15:52"}' data.js
          ! grep -q '19 août provisoire' app-core.js
          ! grep -q 'PROV.' index.html

      - name: Commit official source promotion
        shell: bash
        run: |
          git config user.name 'puy-program-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Promote 19 August official program [v1.4.4]'
          git push
