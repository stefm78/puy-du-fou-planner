name: Fetch official Puy du Fou program

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-official-program.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch official page and discover downloadable program
        shell: bash
        run: |
          set -u
          mkdir -p official
          PAGE='https://www.puydufou.com/france/fr/programme-du-jour'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          : > official/fetch-report.txt
          echo "fetched_at=$(date -u +%FT%TZ)" >> official/fetch-report.txt
          echo "source=$PAGE" >> official/fetch-report.txt
          code=$(curl -sS -L --compressed --connect-timeout 15 --max-time 45 \
            -A "$UA" -H 'Accept-Language: fr-FR,fr;q=0.9,en;q=0.8' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -o official/page.html -w '%{http_code}' "$PAGE" || true)
          echo "page_http=$code" >> official/fetch-report.txt
          echo "page_bytes=$(wc -c < official/page.html 2>/dev/null || echo 0)" >> official/fetch-report.txt

          python <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re, html
          p=Path('official/page.html')
          text=p.read_text('utf-8','ignore') if p.exists() else ''
          base='https://www.puydufou.com/france/fr/programme-du-jour'
          vals=[]
          for pat in [r'''(?:href|src)=["']([^"']+)["']''', r'''https?://[^"'<>\\s]+''']:
              for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v).replace('\\/','/')
                  u=urljoin(base,v)
                  if any(k in u.lower() for k in ('pdf','programme','program','guide')):
                      vals.append(u)
          seen=[]
          for u in vals:
              if u not in seen: seen.append(u)
          Path('official/candidates.txt').write_text('\n'.join(seen),encoding='utf-8')
          clues=[]
          for line in text.splitlines():
              low=line.lower()
              if any(k in low for k in ('télécharger','telecharger','programme de demain','programme du jour','.pdf')):
                  clues.append(line.strip())
          Path('official/page-clues.txt').write_text('\n'.join(clues[:400]),encoding='utf-8')
          PY

          echo "candidate_count=$(grep -c . official/candidates.txt 2>/dev/null || true)" >> official/fetch-report.txt
          cat official/candidates.txt >> official/fetch-report.txt || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils file >/dev/null
          found=''
          i=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            [ $i -gt 40 ] && break
            out="official/candidate-$i.bin"
            c=$(curl -sS -L --compressed --connect-timeout 12 --max-time 40 -A "$UA" -o "$out" -w '%{http_code}' "$u" || true)
            typ=$(file -b --mime-type "$out" 2>/dev/null || true)
            echo "candidate_$i=$c $typ $u" >> official/fetch-report.txt
            if [ "$typ" = 'application/pdf' ]; then
              mv "$out" official/program.pdf
              found="$u"
              break
            fi
            rm -f "$out"
          done < official/candidates.txt

          if [ -n "$found" ]; then
            echo "pdf_url=$found" >> official/fetch-report.txt
            sha256sum official/program.pdf >> official/fetch-report.txt
            pdftotext -layout official/program.pdf official/program.txt || true
            echo "pdf_text_bytes=$(wc -c < official/program.txt 2>/dev/null || echo 0)" >> official/fetch-report.txt
            grep -Ei 'Signe du Triomphe|Vikings|Bal des Oiseaux|Secret de la Lance|Mousquetaire|Dernier Panache|Mime et l|Roi Arthur|Pérouse|Verdun|Renaissance|Premier Royaume|Grand Carillon|Grandes Eaux|Automates' official/program.txt > official/program-key-lines.txt || true
          else
            echo 'pdf_url=NOT_FOUND' >> official/fetch-report.txt
          fi

          # Keep diagnostics compact; never commit the full HTML page.
          rm -f official/page.html official/candidate-*.bin
      - name: Commit fetch result
        shell: bash
        run: |
          git config user.name 'puy-program-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add official
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture official program fetch result [official-fetch-result]'
          git push
